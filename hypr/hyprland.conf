### hyprland.conf

# monitors
source = ~/.config/hypr/monitors.conf
monitor = , preferred, auto, auto

# apps
$terminal = ghostty
$fileManager = dolphin
$menu = wofi -S drun

# autostart
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = bash ~/.config/hypr/startup.sh &
exec-once = hyprpm reload

# env
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# look
general {
    gaps_in = 4
    gaps_out = 6
    border_size = 0
    # col.active_border = rgba(cba6f7ff) rgba(b4befeff) 45deg
    # col.inactive_border = rgba(1e1e2eff)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}
decoration {
    rounding = 0
    dim_inactive = true
    dim_strength = 0.3
}

# animations
animations {
    enabled = false
    bezier = myBezier, 0.87, 0, 0.13, 1
    animation = windows, 1, 5, myBezier, popin
    animation = fade, 1, 5, myBezier
    animation = workspaces, 1, 5, myBezier
}

# misc
dwindle {
    pseudotile = true
    preserve_split = true
}
misc {
    focus_on_activate = true
    force_default_wallpaper = -1
    disable_hyprland_logo = false
    render_unfocused_fps = 60
}
xwayland {
    force_zero_scaling = true
}

# floaties
windowrule = match:title decor8, float on
windowrule = match:title crocodilo, float on
windowrule = match:title bluej.Boot$App, float on # greenfoot
windowrule = match:class dev.tizu.Blocks, float on
windowrule = match:title ^StreamKit.*$, no_dim on
windowrule = match:title .*YouTube.*, no_dim on
windowrule = match:title Projector - Preview, no_dim on
windowrule = match:title ^StreamKit.*$, render_unfocused on

# input
input {
    # kb_layout = de
    # kb_variant = qwerty
    kb_model =
    kb_options = compose:menu
    kb_rules =
    follow_mouse = 1
    sensitivity = 0
}

# keys
$mainMod = SUPER
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, V, togglefloating,
bind = , F11, fullscreen,
bind = $mainMod, space, exec, $menu
bind = $mainMod ALT, period, exec, wofi-emoji
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod ALT, 1, exec, hyprctl dispatch moveworkspacetomonitor 1 current && hyprctl dispatch workspace 1
bind = $mainMod ALT, 2, exec, hyprctl dispatch moveworkspacetomonitor 2 current && hyprctl dispatch workspace 2
bind = $mainMod ALT, 3, exec, hyprctl dispatch moveworkspacetomonitor 3 current && hyprctl dispatch workspace 3
bind = $mainMod ALT, 4, exec, hyprctl dispatch moveworkspacetomonitor 4 current && hyprctl dispatch workspace 4
bind = $mainMod ALT, 5, exec, hyprctl dispatch moveworkspacetomonitor 5 current && hyprctl dispatch workspace 5
bind = $mainMod ALT, 6, exec, hyprctl dispatch moveworkspacetomonitor 6 current && hyprctl dispatch workspace 6
bind = $mainMod ALT, 7, exec, hyprctl dispatch moveworkspacetomonitor 7 current && hyprctl dispatch workspace 7
bind = $mainMod ALT, 8, exec, hyprctl dispatch moveworkspacetomonitor 8 current && hyprctl dispatch workspace 8
bind = $mainMod ALT, 9, exec, hyprctl dispatch moveworkspacetomonitor 9 current && hyprctl dispatch workspace 9
bind = $mainMod ALT, 0, exec, hyprctl dispatch moveworkspacetomonitor 10 current && hyprctl dispatch workspace 10
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bind = , PRINT, exec, bash ~/.config/hypr/screenshot.sh
bind = CTRL, PRINT, exec, bash ~/.config/hypr/screenshot.sh
bind = SHIFT, PRINT, exec, hyprpicker -a
bind = ALT, PRINT, exec, grim - | wl-copy -t image/png
bind = SHIFT, PAUSE, exec, dim -d 0 -p -a 0.25
bind = , PAUSE, exec, pkill dim
bind = ALT, PAUSE, exec, hyprfreeze -a
bindpin = , XF86Launch6, sendshortcut, ALT, F12, class:^(vesktop)$ # PTT
bindpin = , XF86Launch6, exec, bash ~/.config/hypr/obs-mute.sh unmute # hacky!!
bindpinr = , XF86Launch6, exec, bash ~/.config/hypr/obs-mute.sh mute
bindel = ,XF86AudioRaiseVolume, exec, bash ~/.config/hypr/volume.sh 5%+
bindel = ,XF86AudioLowerVolume, exec, bash ~/.config/hypr/volume.sh 5%-
bindel = ,XF86AudioMute, exec, bash ~/.config/hypr/volume.sh MUTE
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bind = $mainMod CTRL ALT SHIFT, L, exec, xdg-open https://linkedin.com
# bind = $mainMod, slash, hyprexpo:expo, toggle
binds {
    drag_threshold = 32
}

plugin:dynamic-cursors {
	mode = rotate
	shaperule = text, rotate:offset: 90
}
